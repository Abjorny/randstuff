<style>
.cookies-informer {
  display: none; 
}

</style>

<div class="cookies-informer" id="cookiesInformer">
  <div class="informer-top">
    <i></i>
    <p>
      На нашем сайте используются cookie–файлы, в том числе сервисов
      веб–аналитики.<br />Используя сайт, вы соглашаетесь на обработку
      персональных данных при помощи cookie–файлов.
    </p>
  </div>
  <div class="informer-bottom">
    <button type="button" style="color: black" aria-label="Принять и закрыть" id="acceptCookies">
      Принять и закрыть
    </button>
    <a href="/privacy" target="_blank">Подробнее</a>
  </div>
</div>

<script>
const INFORMER_KEY = 'cookiesAccepted';
const INFORMER_INTERVAL = 3 * 60 * 60 * 1000;
const informer = document.getElementById('cookiesInformer');
const acceptBtn = document.getElementById('acceptCookies');

function shouldShowInformer() {
  const record = localStorage.getItem(INFORMER_KEY);
  if (!record) return true; 
  const timestamp = parseInt(record, 10);
  return Date.now() - timestamp > INFORMER_INTERVAL;
}

function showInformer() {
  informer.style.display = 'block';
}

function hideInformer() {
  informer.style.display = 'none';
}

acceptBtn.addEventListener('click', () => {
  localStorage.setItem(INFORMER_KEY, Date.now().toString());
  hideInformer();
});

if (shouldShowInformer()) {
  showInformer();
}
</script>
